events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream app_servers {
        server easy-course-app:8080;
    }

    upstream frontend_servers {
        server easy-course-frontend:80;
    }

    server {
        listen 80;
        server_name easy-course.ru www.easy-course.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://easy-course.ru$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name www.easy-course.ru;

        ssl_certificate     /etc/letsencrypt/live/easy-course.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/easy-course.ru/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://easy-course.ru$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name easy-course.ru;

        ssl_certificate     /etc/letsencrypt/live/easy-course.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/easy-course.ru/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 20m;

        location /api/ {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        location /actuator/ {
            proxy_pass http://app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
