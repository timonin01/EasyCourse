name: easycourse-prod

services:
  mysql:
    image: mariadb:11.4
    container_name: easycourse-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-easy_course_db}
      MARIADB_USER: ${MARIADB_USER:-easy_course_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 40s
    ports:
      - "127.0.0.1:3306:3306"

  redis:
    image: redis:7-alpine
    container_name: easycourse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  easy-course-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: easy-course-app:prod
    container_name: easycourse-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: mysql-local
      SPRING_DATASOURCE_URL: jdbc:mariadb://mysql:3306/${MARIADB_DATABASE:-easy_course_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STEPIK_TOKEN_AOP_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://easy-course.ru,https://www.easy-course.ru}
      CORS_ALLOW_CREDENTIALS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  easy-course-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: easy-course-frontend:prod
    container_name: easycourse-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: easycourse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - easy-course-app
      - easy-course-frontend

  certbot:
    image: certbot/certbot:latest
    container_name: easycourse-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  certbot_www: