plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.palantir.docker' version '0.35.0'
}

group = 'org.example'
version = 'unspecified'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    liquibaseRuntime.extendsFrom runtime
}

compileJava {
    options.encoding = "UTF-8"
}

compileTestJava {
    options.encoding = "UTF-8"
}

repositories {
    mavenCentral()
}

ext {
    set('springBootVersion', '3.2.0')
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation("org.springframework.boot:spring-boot-starter-web:$springBootVersion")

}

clean.doFirst {
//    delete "${projectDir}/logs/"
//    println "${projectDir}/logs/"

    delete "${projectDir}/out/"
    println "${projectDir}/out/"

    delete "${projectDir}/build/"
    println "${projectDir}/build/"
}

task cleanGradleCache(type: Delete) {
    delete "${gradle.gradleUserHomeDir}/caches/"
}


jar {
    enabled = false
}

bootJar {
    enabled = true
    archiveBaseName = 'telegram bot app'
    archiveVersion = '1.0.0'
}

test {
    useJUnitPlatform()
}