spring.application.name=bot

server.port=8081

app.kafka.account-update-topic=account-update-listener

app.telegram.token=${TELEGRAM_BOT_TOKEN}
app.telegram.admin-chat-id=${TELEGRAM_ADMIN_CHAT_ID:0}

spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=telegram-bot
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.core.event.serialization.AccountUpdateEventDeserializer

logging.level.root=info
