name: easycourse-local

services:
  mysql-master:
    image: mariadb:11.4
    container_name: easy-course-mysql-master
    restart: unless-stopped
    command: --server-id=1 --log-bin --log-basename=mariadb
    environment:
      MARIADB_ROOT_PASSWORD: Lalka123
      MARIADB_DATABASE: easy_course_db
      MARIADB_USER: easy_course_user
      MARIADB_PASSWORD: easy_course_pass
      MARIADB_REPLICATION_USER: repl
      MARIADB_REPLICATION_PASSWORD: repl_password
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 40s

  mysql-replica-1:
    image: mariadb:11.4
    container_name: easy-course-mysql-replica-1
    restart: unless-stopped
    command: --server-id=2 --log-basename=mariadb
    environment:
      MARIADB_ROOT_PASSWORD: Lalka123
      MARIADB_MASTER_HOST: mysql-master
      MARIADB_REPLICATION_USER: repl
      MARIADB_REPLICATION_PASSWORD: repl_password
      MARIADB_HEALTHCHECK_GRANTS: REPLICA MONITOR
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_replica_1_data:/var/lib/mysql
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--replication_io", "--replication_sql", "--replication" ]
      interval: 10s
      timeout: 20s
      retries: 15
      start_period: 90s

  mysql-replica-2:
    image: mariadb:11.4
    container_name: easy-course-mysql-replica-2
    restart: unless-stopped
    command: --server-id=3 --log-basename=mariadb
    environment:
      MARIADB_ROOT_PASSWORD: Lalka123
      MARIADB_MASTER_HOST: mysql-master
      MARIADB_REPLICATION_USER: repl
      MARIADB_REPLICATION_PASSWORD: repl_password
      MARIADB_HEALTHCHECK_GRANTS: REPLICA MONITOR
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_replica_2_data:/var/lib/mysql
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--replication_io", "--replication_sql", "--replication" ]
      interval: 10s
      timeout: 20s
      retries: 15
      start_period: 90s

  redis-master:
    image: redis:7-alpine
    container_name: easy-course-redis-master
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 5s

  redis-replica-1:
    image: redis:7-alpine
    container_name: easy-course-redis-replica-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    volumes:
      - redis_replica_1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli INFO replication | grep -q 'master_link_status:up'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-replica-2:
    image: redis:7-alpine
    container_name: easy-course-redis-replica-2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    volumes:
      - redis_replica_2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli INFO replication | grep -q 'master_link_status:up'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  easy-course-app-1:
    build:
      context: ..
      dockerfile: app/Dockerfile
    image: easy-course-app:local
    container_name: easy-course-app-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - environment.env
    environment:
      SPRING_PROFILES_ACTIVE: mysql-local
      SPRING_DATASOURCE_URL: jdbc:mariadb://mysql-master:3306/easy_course_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Lalka123
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      STEPIK_TOKEN_AOP_ENABLED: "true"
      CORS_ALLOWED_ORIGIN_PATTERN: "http://localhost:*,https://*.tuna.am,http://*.tuna.am"
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy

  easy-course-app-2:
    image: easy-course-app:local
    container_name: easy-course-app-2
    restart: unless-stopped
    env_file:
      - environment.env
    environment:
      SPRING_PROFILES_ACTIVE: mysql-local
      SPRING_DATASOURCE_URL: jdbc:mariadb://mysql-master:3306/easy_course_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Lalka123
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      STEPIK_TOKEN_AOP_ENABLED: "true"
      CORS_ALLOWED_ORIGIN_PATTERN: "http://localhost:*,https://*.tuna.am,http://*.tuna.am"
    depends_on:
      mysql-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy

  nginx-balancer:
    image: nginx:alpine
    container_name: easy-course-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - easy-course-app-1
      - easy-course-app-2

  loki:
    image: grafana/loki:3.4.2
    container_name: easy-course-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../deploy/observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:3.4.2
    container_name: easy-course-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../deploy/observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.0
    container_name: easy-course-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki

volumes:
  mysql_master_data:
    external: true
    name: app_mysql_master_data
  mysql_replica_1_data:
    external: true
    name: app_mysql_replica_1_data
  mysql_replica_2_data:
    external: true
    name: app_mysql_replica_2_data
  redis_master_data:
    external: true
    name: app_redis_master_data
  redis_replica_1_data:
    external: true
    name: app_redis_replica_1_data
  redis_replica_2_data:
    external: true
    name: app_redis_replica_2_data
  loki_data:
  grafana_data:
